{% extends 'base.html' %}

{% block content %}
<div style="max-width: 900px; margin: 30px auto; color: white;">
    <h2 style="text-align: center; margin-bottom: 20px;">Добави изображение</h2>
    
    <form method="POST" enctype="multipart/form-data" style="display: flex; gap: 20px; background: #18191c; padding: 20px; border-radius: 8px;">
        <div style="width: 320px; background: #111214; padding: 15px; border-radius: 6px; font-size: 14px;">
            <div style="margin-bottom: 15px;">
                <label>Избери файл:</label>
                <input type="file" name="photo" id="photoInput" accept="image/*" required style="width: 100%; margin-top: 5px; color: #ccc;" onchange="previewImage(event)">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; text-align: center; margin-bottom: 5px;">Дата</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" name="day" placeholder="Ден" style="width: 33%; background: #222428; border: 1px solid #333; color: white; padding: 5px; text-align: center;">
                    <input type="text" name="month" placeholder="Месец" style="width: 33%; background: #222428; border: 1px solid #333; color: white; padding: 5px; text-align: center;">
                    <input type="text" name="year" placeholder="Година" style="width: 33%; background: #222428; border: 1px solid #333; color: white; padding: 5px; text-align: center;">
                </div>
                <div style="margin-top: 5px;">
                    <input type="checkbox" id="date_unknown" name="date_unknown">
                    <label for="date_unknown">Датата е неизвестна</label>
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <label>Вид на снимката</label>
                <select name="photo_type" style="width: 100%; background: #222428; border: 1px solid #333; color: white; padding: 6px; margin-top: 3px;">
                    <option>Градски транспорт</option>
                    <option>Междуградски транспорт</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label>Локация</label>
                <input type="text" name="location" placeholder="напр. Варна, Централна поща" style="width: 100%; background: #222428; border: 1px solid #333; color: white; padding: 6px; margin-top: 3px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label>Превозни средства</label>
                <select name="vehicle_type" style="width: 100%; background: #222428; border: 1px solid #333; color: white; padding: 6px; margin-top: 3px;">
                    <option>Автобус</option>
                    <option>Тролейбус</option>
                    <option>Трамвай</option>
                </select>
                <input type="text" name="inventory_number" placeholder="Търсене по инв. номера" style="width: 100%; background: #222428; border: 1px solid #333; color: white; padding: 6px; margin-top: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label>Коментар</label>
                <textarea name="comment" style="width: 100%; height: 60px; background: #222428; border: 1px solid #333; color: white; padding: 6px; margin-top: 3px;"></textarea>
            </div>

            <div style="margin-bottom: 15px;">
                <input type="checkbox" id="is_author" name="is_author" checked>
                <label for="is_author">Аз направих снимката</label>
            </div>

            <button type="submit" style="width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Изпрати за одобрение</button>
        </div>

        <!-- Дясна колона с динамичен Preview -->
        <div style="flex-grow: 1; border: 2px dashed #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #111214; padding: 20px; text-align: center; overflow: hidden;">
            <p id="placeholderText" style="color: #888;">Попълнете данните вляво и изберете файл за качване.</p>
            <img id="imagePreview" src="#" alt="Preview" style="display: none; max-width: 100%; max-height: 450px; border-radius: 6px; object-fit: contain;">
        </div>
    </form>
</div>

<script>
function previewImage(event) {
    const input = event.target;
    const placeholderText = document.getElementById('placeholderText');
    const imagePreview = document.getElementById('imagePreview');

    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            imagePreview.src = e.target.result;
            imagePreview.style.display = 'block';
            placeholderText.style.display = 'none';
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
