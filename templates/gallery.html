{% extends "base.html" %}
{% block content %}
<h2>Снимки на нашия транспорт</h2>

<div class="bus-filters">
    <a href="{{ url_for('gallery', model='all') }}" class="filter-btn {% if selected_model == 'all' %}active{% endif %}">Всички</a>
    <a href="{{ url_for('gallery', model='u12-iii') }}" class="filter-btn {% if selected_model == 'u12-iii' %}active{% endif %}">Urbino 12 III</a>
    <a href="{{ url_for('gallery', model='u12-iv') }}" class="filter-btn {% if selected_model == 'u12-iv' %}active{% endif %}">Urbino 12 IV</a>
    <a href="{{ url_for('gallery', model='u18-iii') }}" class="filter-btn {% if selected_model == 'u18-iii' %}active{% endif %}">Urbino 18 III</a>
</div>

<div class="gallery-container">
    {% for bus in buses %}
    <div class="bus-card">
        <img src="{{ url_for('static', filename='images/' + bus.image) }}" alt="{{ bus.title }}">
        <h3>{{ bus.title }}</h3>
    </div>
    {% endfor %}
</div>
{% endblock %}
